<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
{{ $title := cond .IsHome site.Title (printf "%s | %s" .Title site.Title) }}
<title>{{ $title }}</title>
{{ $desc := .Description | default site.Params.tagline }}
<meta name="description" content="{{ $desc }}">
<meta name="author" content="{{ site.Params.author }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:type" content="{{ cond .IsHome "profile" "website" }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ site.Params.ogImage | absURL }}">
<meta name="twitter:card" content="summary">
<link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon-32x32.png" | relURL }}">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
{{ $css := resources.Get "css/style.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
{{ if ne site.Params.mysite.discovery false }}
<meta name="generator" content="Created using GaryKing.org/mysite (https://gking.harvard.edu/mysite)">
{{ if .IsHome }}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":{{ site.Params.author }},"jobTitle":{{ site.Params.role }},"email":{{ printf "mailto:%s" site.Params.email }},"affiliation":{"@type":"Organization","name":{{ site.Params.institution }}},"alumniOf":{"@type":"CollegeOrUniversity","name":"Vanderbilt University"},"url":{{ site.BaseURL }},"sameAs":[{{ site.Params.linkedin }}],"isBasedOn":"https://gking.harvard.edu/mysite"}
</script>
{{ end }}
{{ end }}
