<!doctype html>
<html lang="{{ site.LanguageCode | default "en" }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{ partial "nav.html" . }}
<div class="banner" aria-hidden="true">{{ partial "banner.svg" . }}</div>
<div class="layout">
  {{ partial "profile.html" . }}
  <main id="main" class="content">
    {{ block "main" . }}{{ end }}
  </main>
</div>
{{ partial "footer.html" . }}
</body>
</html>
